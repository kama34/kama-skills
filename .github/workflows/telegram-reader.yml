name: Telegram Chat Reader
on:
  pull_request:
    paths:
      - 'telegram-chat-reader/**'
      - '.github/workflows/telegram-reader.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        working-directory: telegram-chat-reader/.claude/skills/telegram-chat-reader
    env:
      PYTHONUTF8: '1'
      TELEGRAM_READER_TEST_NATIVE_TDLIB: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and TDLib
        run: python -m pip install -r requirements.txt --only-binary=:all: tdjson==1.8.71
      - name: Load the native TDLib and check the unbound account
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); import reader; print(reader.TDLib().version); assert reader.run(reader.parse_args(['status']))['reason'] == 'login_required'"
      - name: Test on macOS and Windows
        if: runner.os != 'Linux'
        env:
          TELEGRAM_READER_TEST_NATIVE_STORE: '1'
        run: python -m unittest discover -s tests -v
      - name: Test Linux with a temporary Secret Service
        if: runner.os == 'Linux'
        shell: bash
        env:
          TELEGRAM_READER_TEST_NATIVE_STORE: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus
          dbus-run-session -- bash -ec '
            export XDG_RUNTIME_DIR="$(mktemp -d)"
            chmod 700 "$XDG_RUNTIME_DIR"
            printf %s temporary-test-passphrase | gnome-keyring-daemon --unlock --components=secrets
            python -m unittest discover -s tests -v
          '
